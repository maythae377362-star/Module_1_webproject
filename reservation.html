<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection -VELORA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <div class="logo-badge">V</div>
                <div>
                    <div class="brand-title">VELORA</div>
                    <div class="brand-subtitle">HAUTE COUTURE</div>
                </div>
            </a>

            <button class="mobile-toggle" onclick="toggleNav()">☰</button>
            <header class="site-header">
                <nav class="header-container">
                    <ul class="nav-menu" id="navMenu">
                        <li><a href="index.html" class="nav-link active">Home</a></li>
                        <li><a href="about.html" class="nav-link">About</a></li>
                        <li><a href="collection.html" class="nav-link">Menu/Shop</a></li>
                        <li><a href="lookbook.html" class="nav-link">Gallery</a></li>
                        <li><a href="reservation.html" class="nav-link">Reservation</a></li>
                        <li><a href="contact.html" class="nav-link">Contact</a></li>
                        <li><a href="login.html" class="nav-link">Login</a></li>
                    </ul>
                </nav>
            </header>
        </div>
    </header>

    <main class="content-section">
        <h1 class="section-title">VIP Private Fitting</h1>
        <p class="section-subtitle">Book a Suite Session</p>
        <div class="form-container">
            <form onsubmit="event.preventDefault(); alert('Reservation Received!');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select>
                        <option>Handbags & Leather Goods</option>
                        <option>Fine Jewellery</option>
                        <option>Swiss Timepieces</option>
                    </select>
                </div>
                <button type="submit" class="btn-gold" style="width: 100%; border: none; cursor:pointer;">Book
                    Salon</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 VELORA Boutique. All rights reserved.</p>
    </footer>

    <script>
        function toggleNav() {
            var nav = document.getElementById('navMenu');
            nav.classlist.toggle('show');
        }
    </script>
</body>

</html>
